name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel a mid-flight deploy

env:
  IMAGE: ghcr.io/anish5703/trekking-app
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'          # fail pipeline on critical/high CVEs
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ needs.build-scan-push.outputs.image_tag }}
    steps:
      - name: Deploy new version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /opt/trekking-app/backend/trekking-app        # <-- update to actual path on VPS
            PREV_TAG=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' trekking-app 2>/dev/null || echo "latest")
            echo "$PREV_TAG" > .last_good_tag

            git pull origin main
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=$TAG
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            for i in {1..10}; do
              if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app to become healthy... ($i/10)"
              sleep 6
            done
            echo "Health check FAILED"
            exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/trekking-app        # <-- update to actual path on VPS
            PREV_TAG=$(cat .last_good_tag 2>/dev/null || echo "latest")
            export IMAGE_TAG=$PREV_TAG
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app
            echo "Rolled back to $PREV_TAG"